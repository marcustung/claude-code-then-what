# 第二層 AI 對照材料：Claude Code GitHub Action 當「第二位 Reviewer」，只准評論、不准核准、不解除 owner_required。
# 放到 .github/workflows/claude-review.yml。依 code.claude.com/docs/en/github-actions（2026-09 查證）。
# 權限刻意只給 read：Action 以 Claude GitHub App 身分貼 inline comment；workflow 的 GITHUB_TOKEN 無法 approve 或 merge。
name: Claude second reviewer
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0            # 要看得到 base 與 head 的差異
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}   # 訂閱制改用 claude_code_oauth_token
          prompt: |
            你是這個 PR 的第二位 Reviewer，只准評論，不准核准，也不能解除任何 owner_required 的人審要求。
            先讀 PR 描述（五項交接契約：可追溯、獨立證據、語意邊界、影響範圍、可解釋），再讀 diff、相關呼叫端與測試。
            對每一則發現：
            - 必須附來源：檔案:行，或 PR 描述／規格段落的原文；找不到依據就寫「不知道」，不要猜。
            - 指出「需求沒說、程式卻做了」的地方（例：需求只提取消，程式把 Paid 接成 RefundRequested）並要求規則來源。
            - 測試的預期若來自模型或作者自訂的假設而非規則，明確標出。
            - 五項契約哪一項缺件或空白，逐項列出。
            - 若 diff 觸及金額／付款、授權、狀態轉換規則、資料遷移，第一行寫「owner-required：請由 Owner 決定」，不要自行判定低風險。
            不要改任何檔案，不要建議「看起來沒問題」這種無依據的結論。發現以 inline comment 貼在對應行；沒有發現就貼一則摘要說明檢查了哪些檔案。
            PR：${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          claude_args: |
            --model claude-sonnet-5
            --max-turns 12
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
# 替代做法：用官方 code-review 外掛而不自寫提示——
#   plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
#   plugins: "code-review@claude-code-plugins"
#   prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
#   claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
# 校準：每月數三個數——有用、誤報、被處理；誤報留檔（kit/review/routing-policy.yml ai_review.keep_false_positives）。
